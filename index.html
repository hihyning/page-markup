<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page Markup</title>
<style>:root{--bg:#f3f4f7;--fg:#191c24;--muted:#5d6475;--accent:#2f4bdb;--line:#d6d9e1;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#13151b;--fg:#e8eaf0;--muted:#9aa1b2;--accent:#7d93ff;--line:#343949;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}main{max-width:620px;margin:0 auto;padding:56px 20px}h1{font-size:28px;margin:0 0 8px}p{color:var(--muted)}a{color:var(--accent)}ol{padding-left:20px}li{margin:6px 0}code{font-family:ui-monospace,Menlo,monospace;font-size:14px}</style></head>
<body><main><h1>Page Markup</h1><p>Written notes pinned to a mobile web page, published as a scrollable review.</p>
<p>Reviews live under <code>/reviews/</code> and are shared by direct link. See a <a href="reviews/sample-review.html">sample review</a>.</p>
<p>To make reviews, install the Chrome extension from the <a href="https://github.com/hihyning/page-markup">repository</a>.</p></main></body></html>
